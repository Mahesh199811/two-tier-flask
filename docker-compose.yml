services:

  flask:
    build: .
    container_name: flask-app

    ports:
      - "80:5000"

    environment:
      DB_HOST: mysql
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
